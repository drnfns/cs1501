<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="notes for cs1501">
    <title>cs1501 notes | drnfns</title>
    <link rel="stylesheet" href="https://unpkg.com/missing.css@1.2.0">
    <link
      rel="stylesheet"
      href="https://unpkg.com/missing.css@1.2.0/dist/missing-prism.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css"
    >
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.min.css"
    >
  </head>
  <body>
    <main style="max-width: 72ch; margin: auto">
      <noscript>
        <section class="warn box">
          <strong class="titlebar">warning</strong>
          <p>
            looks like you have javascript disabled: syntax highlighting and
            math elements may not render properly.
          </p>
        </section>
      </noscript>
      {{content}}
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
        });
      });
    </script>
  </body>
</html>
